<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Socket.io Desktop + WebRTC</title>
  <style>
    html {
      box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    .container {
      display: flex;
      gap: 2rem;
      flex: 1;
    }

    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
      padding-bottom: 0.5rem;
    }

    #qr-section {
      flex: 0 0 auto;
    }

    #qr {
      padding: 1rem;
      background: #fff;
      border-radius: 8px;
      width: fit-content;
      margin-bottom: 1rem;
    }

    #url {
      color: #0066cc;
      text-decoration: none;
      word-break: break-all;
      font-size: 0.9rem;
    }

    #url:hover {
      text-decoration: underline;
    }

    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      border-radius: 8px;
      min-height: 300px;
      position: relative;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cursor {
      position: absolute;
      width: 1rem;
      height: 1rem;
      margin-left: -.5rem;
      margin-top: -.5rem;
      background: red;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 0.5rem rgba(255, 0, 0, 0.8);
    }

    .status {
      padding: 0.5rem 1rem;
      background: #333;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    .status.connected {
      background: #1a4d1a;
      color: #7fff7f;
    }

    .status.connecting {
      background: #4d4d1a;
      color: #ffff7f;
    }

    .status.disconnected {
      background: #4d1a1a;
      color: #ff7f7f;
    }

    button {
      padding: 0.7rem 1.5rem;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }

    button:hover {
      background: #0052a3;
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h1>Desktop</h1>

  <div class="container">
    <div class="section" id="qr-section">
      <h2>Controller QR Code</h2>
      <div id="qr"></div>
      <a id="url" href=""></a>
      <div id="socket-status" class="status disconnected">Socket: Disconnected</div>
      <div id="webrtc-status" class="status disconnected">WebRTC: Disconnected</div>
    </div>

    <div class="section">
      <h2>Controller Cursor</h2>
      <div id="video-container">
        <div style="text-align: center; color: #999;">
          <p>Waiting for connection...</p>
          <p id="connection-hint"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
    integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script>
    {
      const $url = document.getElementById('url');
      const $qr = document.getElementById('qr');
      const $socketStatus = document.getElementById('socket-status');
      const $webrtcStatus = document.getElementById('webrtc-status');
      const $videoContainer = document.getElementById('video-container');
      const $connectionHint = document.getElementById('connection-hint');

      let socket;
      let simplePeer;
      let remoteSocketId;

      const updateSocketStatus = (status) => {
        $socketStatus.textContent = `Socket: ${status}`;
        $socketStatus.className = `status ${status.toLowerCase()}`;
      };

      const updateWebRTCStatus = (status) => {
        $webrtcStatus.textContent = `WebRTC: ${status}`;
        $webrtcStatus.className = `status ${status.toLowerCase()}`;
      };

      const setupSimplePeer = () => {
        console.log('[DESKTOP] Setting up Simple-Peer as responder (initiator: false)');

        simplePeer = new SimplePeer({
          initiator: false,
          trickle: true,
          config: {
            iceServers: [
              { urls: ['stun:stun.l.google.com:19302'] },
              { urls: ['stun:stun1.l.google.com:19302'] }
            ]
          }
        });

        // Send signal events via Socket.io
        simplePeer.on('signal', signal => {
          console.log('[DESKTOP] Emitting signal to', remoteSocketId);
          socket.emit('signal', {
            targetSocketId: remoteSocketId,
            signal: signal
          });
        });

        simplePeer.on('connect', () => {
          console.log('[DESKTOP] Simple-Peer connected!');
          updateWebRTCStatus('Connected');
        });

        simplePeer.on('error', (err) => {
          console.error('[DESKTOP] Simple-Peer error:', err);
        });

        simplePeer.on('close', () => {
          console.log('[DESKTOP] Simple-Peer closed');
          updateWebRTCStatus('Disconnected');
        });
      };

      const closeSimplePeer = () => {
        if (simplePeer) {
          simplePeer.destroy();
          simplePeer = null;
        }
        updateWebRTCStatus('Disconnected');
      };

      const init = () => {
        socket = io.connect('/');

        socket.on('connect', () => {
          console.log('[DESKTOP] Socket connected:', socket.id);
          updateSocketStatus('Connected');

          const url = `${new URL(`/controller.html?id=${socket.id}`, window.location)}`;
          $url.textContent = url;
          $url.setAttribute('href', url);

          const typeNumber = 4;
          const errorCorrectionLevel = 'L';
          const qr = qrcode(typeNumber, errorCorrectionLevel);
          qr.addData(url);
          qr.make();
          $qr.innerHTML = qr.createImgTag(4);

          $connectionHint.textContent = 'Scan QR code with your phone to connect';
        });

        // Handle incoming signal from controller
        socket.on('signal', (data) => {
          console.log('[DESKTOP] Received signal from', data.from);
          remoteSocketId = data.from;

          if (!simplePeer) {
            setupSimplePeer();
          }

          try {
            simplePeer.signal(data.signal);
          } catch (error) {
            console.error('[DESKTOP] Error signaling:', error);
          }
        });

        // Handle cursor position updates via socket
        socket.on('update', data => {
          let $cursor = document.querySelector(`#cursor`);
          if (!$cursor) {
            $cursor = document.createElement(`div`);
            $cursor.classList.add(`cursor`);
            $cursor.setAttribute(`id`, `cursor`);
            $videoContainer.appendChild($cursor);
          }
          $cursor.style.left = `${data.x * $videoContainer.clientWidth}px`;
          $cursor.style.top = `${data.y * $videoContainer.clientHeight}px`;
        });

        socket.on('peer-disconnected', (peerId) => {
          console.log('[DESKTOP] Peer disconnected:', peerId);
          if (peerId === remoteSocketId) {
            closeSimplePeer();
          }
        });

        socket.on('disconnect', () => {
          console.log('[DESKTOP] Socket disconnected');
          updateSocketStatus('Disconnected');
          closeSimplePeer();
        });
      };

      init();
    }
  </script>
</body>

</html>
