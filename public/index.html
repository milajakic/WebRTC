<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variable Font Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f0ece4;
      --accent: #F44611;
      --muted: #2a2a2a;
      --panel: #111;
      --border: #222;
      --wght: 400;
      --wdth: 100;
      --slnt: 0;
      --opsz: 36;
      --wonk: 0;
      --cursor-x: 50%;
      --cursor-y: 50%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Fraunces', Georgia, serif;
      overflow: hidden;
    }

    /* ── WAITING SCREEN ──────────────────────────── */
    #waiting {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #waiting::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.3;
      pointer-events: none;
    }

    #waiting.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    #waiting.gone {
      display: none;
    }

    .w-eyebrow {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #444;
      position: relative;
    }

    .w-title {
      font-variation-settings: 'wght' 800, 'opsz' 72;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      position: relative;
    }

    .w-title span {
      color: var(--accent);
    }

    #qr-box {
      position: relative;
      background: #fff;
      padding: 1.2rem;
      border-radius: 6px;
    }

    #qr-box img {
      display: block;
      image-rendering: pixelated;
    }

    #qr-box::after {
      content: '';
      position: absolute;
      inset: -8px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      animation: pulse-ring 2s ease-in-out infinite;
    }

    @keyframes pulse-ring {

      0%,
      100% {
        opacity: 0.15;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
    }

    #waiting-url {
      font-family: monospace;
      font-size: 0.68rem;
      color: #444;
      position: relative;
    }

    .w-hint {
      font-size: 0.72rem;
      color: #555;
      position: relative;
    }

    #waiting-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      position: relative;
    }

    .wdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.4s, box-shadow 0.4s;
    }

    .wdot.on {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── CANVAS ─────────────────────────────────── */
    #canvas {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 3rem;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #canvas.visible {
      opacity: 1;
    }

    #canvas::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
    }

    #canvas::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 40vw at var(--cursor-x) var(--cursor-y),
          rgba(244, 70, 17, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .word {
      font-family: 'Fraunces', Georgia, serif;
      font-variation-settings: 'wght' var(--wght), 'wdth' var(--wdth), 'opsz' var(--opsz), 'WONK' var(--wonk);
      font-style: oblique calc(var(--slnt) * 1deg);
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: var(--fg);
      transition: font-variation-settings 0.05s linear, font-style 0.05s linear, color 0.3s ease, opacity 0.3s ease;
      user-select: none;
      white-space: nowrap;
      will-change: font-variation-settings;
    }

    .word-1 {
      font-size: clamp(4rem, 14vw, 16rem);
    }

    .word-2 {
      font-size: clamp(3rem, 10vw, 11rem);
      opacity: 0.7;
    }

    .word-3 {
      font-size: clamp(2rem, 7vw, 8rem);
      opacity: 0.45;
    }

    .word-4 {
      font-size: clamp(1.5rem, 5vw, 5.5rem);
      opacity: 0.25;
    }

    .word.italic {
      font-style: italic;
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 36px;
      width: 220px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.2rem;
      gap: 1.1rem;
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
    }

    #sidebar.visible {
      transform: translateX(0);
    }

    .sidebar-title {
      font-variation-settings: 'wght' 800, 'opsz' 12;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .axis-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .axis-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: #666;
    }

    .axis-label span:last-child {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .axis-bar-bg {
      height: 2px;
      background: var(--muted);
      border-radius: 2px;
      overflow: hidden;
    }

    .axis-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.05s linear;
      will-change: width;
    }

    /* ── STATUS BAR ──────────────────────────────── */
    #statusbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.2rem;
      gap: 1.5rem;
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
    }

    #statusbar.visible {
      transform: translateY(0);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #444;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .dot.connected {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .dot.disconnected {
      background: #ff4444;
    }

    #qr-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s;
    }

    #qr-wrap:hover {
      opacity: 1;
    }

    #url-short {
      font-size: 0.58rem;
      color: #555;
      font-family: monospace;
    }

    /* ── QR MODAL ────────────────────────────────── */
    #qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #qr-modal.visible {
      opacity: 1;
      pointer-events: all;
    }

    #qr-modal-inner {
      background: #fff;
      padding: 2rem;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #qr-modal-inner p {
      font-size: 0.68rem;
      color: #333;
      font-family: monospace;
      word-break: break-all;
      max-width: 260px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- ── WAITING SCREEN ── -->
  <div id="waiting">
    <div class="w-eyebrow">Variable Font Controller</div>
    <div class="w-title">Scan to<br><span>Connect</span></div>
    <div id="qr-box">
      <div id="qr-waiting"></div>
    </div>
    <div id="waiting-url">Verbinden met server…</div>
    <div class="w-hint">Open de URL op je smartphone</div>
    <div id="waiting-status">
      <div class="wdot" id="wdot"></div>
      <span id="wstatus-text">Wacht op verbinding…</span>
    </div>
  </div>

  <!-- ── CANVAS ── -->
  <div id="canvas">
    <div class="word word-1" id="word1">Variable</div>
    <div class="word word-2" id="word2">Font</div>
    <div class="word word-3" id="word3">Controller</div>
    <div class="word word-4" id="word4">WebRTC</div>
  </div>

  <!-- ── SIDEBAR ── -->
  <div id="sidebar">
    <div class="sidebar-title">Font Axes</div>
    <div class="axis-row">
      <div class="axis-label"><span>Weight</span><span id="val-wght">400</span></div>
      <div class="axis-bar-bg">
        <div class="axis-bar" id="bar-wght" style="width:33%"></div>
      </div>
    </div>
    <div class="axis-row">
      <div class="axis-label"><span>Width</span><span id="val-wdth">100</span></div>
      <div class="axis-bar-bg">
        <div class="axis-bar" id="bar-wdth" style="width:50%"></div>
      </div>
    </div>
    <div class="axis-row">
      <div class="axis-label"><span>Optical Size</span><span id="val-opsz">36</span></div>
      <div class="axis-bar-bg">
        <div class="axis-bar" id="bar-opsz" style="width:20%"></div>
      </div>
    </div>
    <div class="axis-row">
      <div class="axis-label"><span>Slant</span><span id="val-slnt">0</span></div>
      <div class="axis-bar-bg">
        <div class="axis-bar" id="bar-slnt" style="width:50%"></div>
      </div>
    </div>
    <div class="axis-row">
      <div class="axis-label"><span>Wonky</span><span id="val-wonk">0</span></div>
      <div class="axis-bar-bg">
        <div class="axis-bar" id="bar-wonk" style="width:0%"></div>
      </div>
    </div>
    <div class="sidebar-title" style="margin-top:0.2rem;">Sensor</div>
    <div style="font-size:0.63rem; color:#444; line-height:2; font-family:monospace;">
      <div>β <span id="s-beta">—</span></div>
      <div>γ <span id="s-gamma">—</span></div>
      <div>italic <span id="s-italic">—</span></div>
    </div>
  </div>

  <!-- ── STATUS BAR ── -->
  <div id="statusbar">
    <div class="status-pill">
      <div class="dot disconnected" id="dot-socket"></div>
      <span>Socket</span>
    </div>
    <div class="status-pill">
      <div class="dot disconnected" id="dot-webrtc"></div>
      <span>WebRTC</span>
    </div>
    <div class="status-pill">
      <span id="fps-val">0</span><span>msg/s</span>
    </div>
    <div id="qr-wrap" onclick="document.getElementById('qr-modal').classList.toggle('visible')">
      <span id="url-short">—</span>
      <div id="qr-small"></div>
    </div>
  </div>

  <!-- ── QR MODAL ── -->
  <div id="qr-modal" onclick="this.classList.remove('visible')">
    <div id="qr-modal-inner" onclick="event.stopPropagation()">
      <div id="qr-big"></div>
      <p id="qr-url-text"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
    integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script>
    {
      const root = document.documentElement;
      const canvas = document.getElementById('canvas');
      const words = document.querySelectorAll('.word');

      // ── State ────────────────────────────────────────────────────
      const state = {
        wght: 400, wdth: 100, opsz: 36, slnt: 0, wonk: 0,
        x: 0.5, y: 0.5, beta: 0, gamma: 0, italic: false
      };

      // ── Flow ──────────────────────────────────────────────────────
      let connected = false;

      function transitionToConnected() {
        if (connected) return;
        connected = true;

        const waiting = document.getElementById('waiting');
        waiting.classList.add('fade-out');
        setTimeout(() => waiting.classList.add('gone'), 900);

        canvas.classList.add('visible');
        document.getElementById('sidebar').classList.add('visible');
        document.getElementById('statusbar').classList.add('visible');
      }

      function setWaitingStatus(text, active) {
        document.getElementById('wstatus-text').textContent = text;
        document.getElementById('wdot').classList.toggle('on', active);
      }

      // ── Msg counter ──────────────────────────────────────────────
      let msgCount = 0;
      setInterval(() => {
        document.getElementById('fps-val').textContent = msgCount;
        msgCount = 0;
      }, 1000);

      // ── Color modes ───────────────────────────────────────────────
      const COLOR_MODES = {
        default: { bg: '#0a0a0a', fg: '#f0ece4' },
        inverted: { bg: '#f0ece4', fg: '#0a0a0a' },
        accent: { bg: '#0a1a00', fg: '#c8ff00' },
        hot: { bg: '#1a0000', fg: '#ff6644' },
        cold: { bg: '#00061a', fg: '#88ccff' }
      };

      // ── Apply state ───────────────────────────────────────────────
      function applyState() {
        root.style.setProperty('--wght', state.wght);
        root.style.setProperty('--wdth', state.wdth);
        root.style.setProperty('--opsz', state.opsz);
        root.style.setProperty('--slnt', state.slnt);
        root.style.setProperty('--wonk', state.wonk);
        root.style.setProperty('--cursor-x', (state.x * 100) + '%');
        root.style.setProperty('--cursor-y', (state.y * 100) + '%');
        words.forEach(w => w.classList.toggle('italic', state.italic));

        document.getElementById('val-wght').textContent = Math.round(state.wght);
        document.getElementById('val-wdth').textContent = Math.round(state.wdth);
        document.getElementById('val-opsz').textContent = Math.round(state.opsz);
        document.getElementById('val-slnt').textContent = Math.round(state.slnt * 10) / 10;
        document.getElementById('val-wonk').textContent = Math.round(state.wonk * 10) / 10;
        document.getElementById('bar-wght').style.width = ((state.wght - 100) / 800 * 100) + '%';
        document.getElementById('bar-wdth').style.width = ((state.wdth - 75) / 50 * 100) + '%';
        document.getElementById('bar-opsz').style.width = ((state.opsz - 9) / 135 * 100) + '%';
        document.getElementById('bar-slnt').style.width = ((state.slnt + 90) / 180 * 100) + '%';
        document.getElementById('bar-wonk').style.width = (state.wonk * 100) + '%';
        document.getElementById('s-beta').textContent = Math.round(state.beta) + '°';
        document.getElementById('s-gamma').textContent = Math.round(state.gamma) + '°';
        document.getElementById('s-italic').textContent = state.italic ? 'aan' : 'uit';
      }

      // ── Handle incoming message ───────────────────────────────────
      function handleMessage(raw) {
        msgCount++;
        let msg;
        try { msg = JSON.parse(raw); } catch { return; }

        if (msg.type === 'font') {
          stopIdle();
          const a = msg.axes;
          if (a.wght !== undefined) state.wght = Math.min(900, Math.max(100, a.wght));
          if (a.wdth !== undefined) state.wdth = Math.min(125, Math.max(75, a.wdth));
          if (a.opsz !== undefined) state.opsz = Math.min(144, Math.max(9, a.opsz));
          if (a.slnt !== undefined) state.slnt = Math.min(90, Math.max(-90, a.slnt));
          if (a.wonk !== undefined) state.wonk = Math.min(1, Math.max(0, a.wonk));
          if (a.x !== undefined) state.x = a.x;
          if (a.y !== undefined) state.y = a.y;
          if (a.beta !== undefined) state.beta = a.beta;
          if (a.gamma !== undefined) state.gamma = a.gamma;
          applyState();
        }

        if (msg.type === 'italic') {
          state.italic = msg.value;
          applyState();
          if (simplePeer && simplePeer.connected) {
            try { simplePeer.send(JSON.stringify({ type: 'feedback', italic: msg.value })); } catch (e) { }
          }
        }

        if (msg.type === 'color') {
          const m = COLOR_MODES[msg.mode] || COLOR_MODES.default;
          document.body.style.background = m.bg;
          root.style.setProperty('--fg', m.fg);
          root.style.setProperty('--bg', m.bg);
        }
      }

      // ── Idle animation ────────────────────────────────────────────
      let idleRAF, idleT = 0;
      function idleAnimate() {
        idleT += 0.008;
        state.wght = 100 + (Math.sin(idleT) * 0.5 + 0.5) * 800;
        state.slnt = Math.sin(idleT * 0.7) * 12;
        state.opsz = 9 + (Math.sin(idleT * 0.4) * 0.5 + 0.5) * 135;
        state.wonk = Math.sin(idleT * 1.3) * 0.5 + 0.5;
        applyState();
        idleRAF = requestAnimationFrame(idleAnimate);
      }

      function stopIdle() {
        if (idleRAF) cancelAnimationFrame(idleRAF);
        idleRAF = null;
      }

      // ── QR helper ─────────────────────────────────────────────────
      function makeQR(el, size) {
        const q = qrcode(4, 'L');
        q.addData(el._url);
        q.make();
        el.innerHTML = q.createImgTag(size);
      }

      // ── Socket + SimplePeer ───────────────────────────────────────
      let socket, simplePeer, remoteSocketId;

      function setDot(id, cls) {
        document.getElementById(id).className = 'dot ' + cls;
      }

      function setupSimplePeer() {
        simplePeer = new SimplePeer({
          initiator: false,
          trickle: true,
          config: {
            iceServers: [
              { urls: ['stun:stun.l.google.com:19302'] },
              { urls: ['stun:stun1.l.google.com:19302'] }
            ]
          }
        });

        simplePeer.on('signal', signal => socket.emit('signal', remoteSocketId, signal));

        simplePeer.on('connect', () => {
          setDot('dot-webrtc', 'connected');
          transitionToConnected();
          idleAnimate(); // idle speelt op canvas tot eerste data
        });

        simplePeer.on('data', data => {
          handleMessage(typeof data === 'string' ? data : new TextDecoder().decode(data));
        });

        simplePeer.on('error', err => console.error('[DESKTOP]', err));

        simplePeer.on('close', () => {
          setDot('dot-webrtc', 'disconnected');
          simplePeer = null;
        });
      }

      function closeSimplePeer() {
        if (simplePeer) { simplePeer.destroy(); simplePeer = null; }
        setDot('dot-webrtc', 'disconnected');
      }

      socket = io.connect('/');

      socket.on('connect', () => {
        setDot('dot-socket', 'connected');
        setWaitingStatus('Socket verbonden — scan de QR-code', true);

        const url = new URL(`/controller.html?id=${socket.id}`, window.location).href.replace('http://', 'https://');

        document.getElementById('waiting-url').textContent = url;
        document.getElementById('url-short').textContent = socket.id.substring(0, 8) + '…';
        document.getElementById('qr-url-text').textContent = url;

        const qw = document.getElementById('qr-waiting');
        const qs = document.getElementById('qr-small');
        const qb = document.getElementById('qr-big');
        [qw, qs, qb].forEach(el => el._url = url);

        const qWait = qrcode(4, 'L'); qWait.addData(url); qWait.make();
        qw.innerHTML = qWait.createImgTag(5);

        const qSmall = qrcode(4, 'L'); qSmall.addData(url); qSmall.make();
        qs.innerHTML = qSmall.createImgTag(1);

        const qBig = qrcode(4, 'L'); qBig.addData(url); qBig.make();
        qb.innerHTML = qBig.createImgTag(6);
      });

      socket.on('signal', (peerId, signal, fromId) => {
        remoteSocketId = fromId;
        setWaitingStatus('Telefoon gevonden — verbinden…', true);
        if (!simplePeer) setupSimplePeer();
        try { simplePeer.signal(signal); } catch (e) { console.error(e); }
      });

      socket.on('update', data => { state.x = data.x; state.y = data.y; applyState(); });

      socket.on('client-disconnect', client => {
        if (client && client.id === remoteSocketId) closeSimplePeer();
      });

      socket.on('disconnect', () => {
        setDot('dot-socket', 'disconnected');
        closeSimplePeer();
      });
    }
  </script>
</body>

</html>
