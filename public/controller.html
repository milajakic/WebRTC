<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Variable Font Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f0ece4;
            --accent: #F44611;
            --muted: #1a1a1a;
            --border: #242424;
            --panel: #111;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Fraunces', Georgia, serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Prevent pull-to-refresh */
            overscroll-behavior: none;
            touch-action: none;
        }

        header {
            flex: 0 0 auto;
            padding: 1rem 1.2rem 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-variation-settings: 'wght' 800, 'opsz' 12;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--accent);
        }

        .connection-pills {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--muted);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.2rem 0.6rem;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
            transition: color 0.3s, border-color 0.3s;
        }

        .pill.connected {
            color: var(--accent);
            border-color: rgba(200, 255, 0, 0.3);
        }

        .pill-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        #touchpad {
            position: relative;
            flex: 0 0 auto;
            height: 38vh;
            margin: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            cursor: crosshair;
            overflow: hidden;
        }

        #touchpad-label {
            position: absolute;
            top: 0.7rem;
            left: 0.8rem;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #444;
            pointer-events: none;
        }

        #touchpad::before,
        #touchpad::after {
            content: '';
            position: absolute;
            background: var(--border);
            pointer-events: none;
        }

        #touchpad::before {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            transform: translateX(-50%);
        }

        #touchpad::after {
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            transform: translateY(-50%);
        }

        #touch-cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            pointer-events: none;
            transition: left 0.05s linear, top 0.05s linear;
            box-shadow: 0 0 12px rgba(200, 255, 0, 0.4);
        }

        #touch-cursor::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
        }

        #tp-x-label {
            position: absolute;
            bottom: 0.6rem;
            right: 0.8rem;
            font-size: 0.55rem;
            color: #444;
            letter-spacing: 0.1em;
        }

        #tp-y-label {
            position: absolute;
            top: 50%;
            left: 0.5rem;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 0.55rem;
            color: #444;
            letter-spacing: 0.1em;
            transform-origin: center;
        }

        #controls {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            -webkit-overflow-scrolling: touch;
        }

        .control-row {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.7rem 0.9rem;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .control-name {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #777;
        }

        .control-value {
            font-size: 0.75rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-variation-settings: 'wght' 700, 'opsz' 10;
            min-width: 4ch;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(200, 255, 0, 0.5);
        }

        .gyro-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0 0.8rem;
        }

        .gyro-toggle {
            flex: 1;
            padding: 0.7rem;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #666;
            font-family: 'Fraunces', serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
            text-align: center;
        }

        .gyro-toggle.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .color-strip {
            display: flex;
            gap: 0.5rem;
            padding: 0 0.8rem 0.8rem;
        }

        .color-btn {
            flex: 1;
            height: 32px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .color-btn:active {
            transform: scale(0.93);
        }

        .color-btn.active {
            border-color: var(--accent);
            border-width: 2px;
        }

        .color-btn[data-mode="default"] {
            background: linear-gradient(135deg, #0a0a0a 50%, #f0ece4 50%);
        }

        .color-btn[data-mode="inverted"] {
            background: linear-gradient(135deg, #f0ece4 50%, #0a0a0a 50%);
        }

        .color-btn[data-mode="accent"] {
            background: linear-gradient(135deg, #0a1a00 50%, #c8ff00 50%);
        }

        .color-btn[data-mode="hot"] {
            background: linear-gradient(135deg, #1a0000 50%, #ff6644 50%);
        }

        .color-btn[data-mode="cold"] {
            background: linear-gradient(135deg, #00061a 50%, #88ccff 50%);
        }


        .gyro-viz {
            position: relative;
            height: 50px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin: 0 0.8rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gyro-ball {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            position: absolute;
            transition: left 0.05s, top 0.05s;
            box-shadow: 0 0 8px rgba(244, 70, 17, 0.6);
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }

        .gyro-viz-label {
            font-size: 0.55rem;
            color: #333;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 1;
        }


        .section-label {
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #444;
            padding: 0.3rem 0.8rem 0;
        }
    </style>
</head>

<body>


    <header>
        <div class="logo">Variable<span>Font</span></div>
        <div class="connection-pills">
            <div class="pill" id="pill-socket">
                <div class="pill-dot"></div>
                <span>Socket</span>
            </div>
            <div class="pill" id="pill-webrtc">
                <div class="pill-dot"></div>
                <span>WebRTC</span>
            </div>
        </div>
    </header>

    <div id="touchpad">
        <div id="touchpad-label">Touch Pad</div>
        <div style="position:absolute;bottom:0.6rem;left:0.8rem;font-size:0.55rem;color:#333;letter-spacing:0.08em;">←
            WEIGHT →</div>
        <div
            style="position:absolute;top:0.6rem;right:0.7rem;font-size:0.55rem;color:#333;letter-spacing:0.08em;writing-mode:vertical-lr;">
            SLANT ↑</div>
        <div id="touch-cursor"></div>
    </div>


    <div id="controls">

        <div class="section-label">Axes</div>


        <div class="control-row">
            <div class="control-header">
                <span class="control-name">Optical Size</span>
                <span class="control-value" id="label-opsz">36</span>
            </div>
            <input type="range" id="slider-opsz" min="9" max="144" step="1" value="36">
        </div>


        <div class="control-row">
            <div class="control-header">
                <span class="control-name">Wonky</span>
                <span class="control-value" id="label-wonk">0</span>
            </div>
            <input type="range" id="slider-wonk" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="section-label">Gyroscope</div>

        <div class="gyro-viz">
            <div class="gyro-viz-label">tilt to control weight + slant</div>
            <div id="gyro-ball"></div>
        </div>

        <div class="gyro-row">
            <button class="gyro-toggle" id="gyro-btn">Enable Gyro</button>
        </div>
        <div style="padding: 0.3rem 0.8rem; font-size: 0.65rem; font-family: monospace; color: #F44611; min-height: 1.2rem;"
            id="gyro-debug"></div>

        <div class="section-label">Color Mode</div>

        <div class="color-strip">
            <div class="color-btn active" data-mode="default" title="Default"></div>
            <div class="color-btn" data-mode="inverted" title="Inverted"></div>
            <div class="color-btn" data-mode="accent" title="Acid"></div>
            <div class="color-btn" data-mode="hot" title="Hot"></div>
            <div class="color-btn" data-mode="cold" title="Cold"></div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        {
            const $ = id => document.getElementById(id);
            const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
            const lerp = (a, b, t) => a + (b - a) * t;

            const axes = { wght: 400, opsz: 36, slnt: 0, wonk: 0, x: 0.5, y: 0.5, alpha: 0, beta: 0, gamma: 0 };
            let gyroEnabled = false;
            let gyroSmooth = { beta: 0, gamma: 0 };

            let rafRunning = false;
            function startRAF() {
                if (rafRunning) return;
                rafRunning = true;
                loop();
            }

            function loop() {
                if (gyroEnabled) {
                    gyroSmooth.beta = lerp(gyroSmooth.beta, axes.beta, 0.12);
                    gyroSmooth.gamma = lerp(gyroSmooth.gamma, axes.gamma, 0.12);


                    axes.wght = clamp(100 + ((gyroSmooth.beta + 90) / 180) * 800, 100, 900);
                    axes.slnt = clamp((gyroSmooth.gamma / 90) * 12, -12, 12);


                    const ball = $('gyro-ball');
                    const viz = document.querySelector('.gyro-viz');
                    const bx = clamp((gyroSmooth.gamma + 90) / 180, 0, 1) * viz.clientWidth;
                    const by = clamp((gyroSmooth.beta + 90) / 180, 0, 1) * viz.clientHeight;
                    ball.style.left = bx + 'px';
                    ball.style.top = by + 'px';
                }

                sendFontMessage();
                requestAnimationFrame(loop);
            }

            const SEND_INTERVAL = 16;
            let lastSent = 0;

            function sendFontMessage() {
                const now = performance.now();
                if (now - lastSent < SEND_INTERVAL) return;
                lastSent = now;

                const msg = JSON.stringify({
                    type: 'font',
                    axes: { ...axes }
                });

                if (simplePeer && simplePeer.connected) {
                    try { simplePeer.send(msg); } catch (e) { }
                } else if (socket && socket.connected && targetSocketId) {
                    socket.emit('update', targetSocketId, { x: axes.x, y: axes.y });
                }
            }
            const touchpad = $('touchpad');
            const cursor = $('touch-cursor');

            function updateFromTouch(clientX, clientY) {
                const rect = touchpad.getBoundingClientRect();
                const nx = clamp((clientX - rect.left) / rect.width, 0, 1);
                const ny = clamp((clientY - rect.top) / rect.height, 0, 1);

                axes.x = nx;
                axes.y = ny;
                axes.wght = clamp(100 + nx * 800, 100, 900);
                axes.slnt = clamp((ny - 0.5) * -24, -12, 12);

                cursor.style.left = (nx * 100) + '%';
                cursor.style.top = (ny * 100) + '%';
            }

            touchpad.addEventListener('touchstart', e => {
                e.preventDefault();
                updateFromTouch(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            touchpad.addEventListener('touchmove', e => {
                e.preventDefault();
                updateFromTouch(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            touchpad.addEventListener('mousedown', e => updateFromTouch(e.clientX, e.clientY));
            touchpad.addEventListener('mousemove', e => { if (e.buttons) updateFromTouch(e.clientX, e.clientY); });

            function setupSlider(id, axisKey, labelId) {
                const el = $(id);
                const lb = $(labelId);
                el.addEventListener('input', () => {
                    axes[axisKey] = parseFloat(el.value);
                    lb.textContent = Math.round(parseFloat(el.value) * 100) / 100;
                });
            }

            setupSlider('slider-opsz', 'opsz', 'label-opsz');
            setupSlider('slider-wonk', 'wonk', 'label-wonk');

            const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (!isSecure) {
                $('gyro-btn').textContent = 'Gyro: HTTPS vereist';
                $('gyro-btn').style.opacity = '0.4';
                $('gyro-btn').disabled = true;
            }

            $('gyro-btn').addEventListener('click', async () => {
                if (!gyroEnabled) {
                    if (typeof DeviceOrientationEvent !== 'undefined' &&
                        typeof DeviceOrientationEvent.requestPermission === 'function') {
                        try {
                            const perm = await DeviceOrientationEvent.requestPermission();
                            if (perm !== 'granted') { alert('Gyro permission geweigerd'); return; }
                        } catch (e) { alert('Permission error: ' + e.message); return; }
                    }

                    let testFired = false;
                    const testHandler = () => { testFired = true; };
                    window.addEventListener('deviceorientation', testHandler);
                    setTimeout(() => {
                        window.removeEventListener('deviceorientation', testHandler);
                        if (!testFired) $('gyro-debug').textContent = '⚠ Geen gyro events ontvangen';
                    }, 1500);

                    window.addEventListener('deviceorientation', onOrientation);
                    gyroEnabled = true;
                    $('gyro-btn').textContent = 'Disable Gyro';
                    $('gyro-btn').classList.add('active');
                } else {
                    window.removeEventListener('deviceorientation', onOrientation);
                    gyroEnabled = false;
                    $('gyro-btn').textContent = 'Enable Gyro';
                    $('gyro-btn').classList.remove('active');
                    $('gyro-debug').textContent = '';
                }
            });

            function onOrientation(e) {
                axes.alpha = e.alpha != null ? e.alpha : 0;
                axes.beta = e.beta != null ? e.beta : 0;
                axes.gamma = e.gamma != null ? e.gamma : 0;
                $('gyro-debug').textContent = `β ${Math.round(axes.beta)}°  γ ${Math.round(axes.gamma)}°`;
            }

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const msg = JSON.stringify({ type: 'color', mode: btn.dataset.mode });
                    if (simplePeer && simplePeer.connected) {
                        try { simplePeer.send(msg); } catch (e) { }
                    }
                });
            });

            let socket, simplePeer, targetSocketId;

            function setPill(id, connected) {
                const el = $(id);
                el.classList.toggle('connected', connected);
            }

            function setupSimplePeer() {
                simplePeer = new SimplePeer({
                    initiator: true,
                    trickle: true,
                    config: {
                        iceServers: [
                            { urls: ['stun:stun.l.google.com:19302'] },
                            { urls: ['stun:stun1.l.google.com:19302'] }
                        ]
                    }
                });

                simplePeer.on('signal', signal => {
                    socket.emit('signal', targetSocketId, signal);
                });

                simplePeer.on('connect', () => {
                    setPill('pill-webrtc', true);
                });

                simplePeer.on('error', err => console.error('[CTRL] Peer error:', err));

                simplePeer.on('close', () => {
                    setPill('pill-webrtc', false);
                    simplePeer = null;
                });
            }

            function getParam(name) {
                const r = new RegExp('[\\?&]' + name.replace(/[\[\]]/g, '\\$&') + '=([^&#]*)');
                const m = r.exec(location.search);
                return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : false;
            }

            targetSocketId = getParam('id');
            if (!targetSocketId) {
                document.body.innerHTML = '<div style="padding:2rem;color:#ff4444;font-family:monospace;">Missing ?id= parameter</div>';
            } else {
                socket = io.connect('/');

                socket.on('connect', () => {
                    setPill('pill-socket', true);
                    setupSimplePeer();
                    startRAF();
                });

                socket.on('signal', (peerId, signal, fromId) => {
                    if (!simplePeer) setupSimplePeer();
                    try { simplePeer.signal(signal); } catch (e) { console.error(e); }
                });

                socket.on('disconnect', () => {
                    setPill('pill-socket', false);
                    setPill('pill-webrtc', false);
                });
            }
        }
    </script>
</body>

</html>
